<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable (404) — STV 83</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/logo.png">
  <!-- Self-hosted Inter fonts -->
  <link rel="preload" href="/preprod/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/preprod/fonts/Inter-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Inter';
      font-weight: 400;
      font-display: swap;
      src: url('/preprod/fonts/Inter-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-weight: 700;
      font-display: swap;
      src: url('/preprod/fonts/Inter-Bold.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-weight: 800;
      font-display: swap;
      src: url('/preprod/fonts/Inter-ExtraBold.woff2') format('woff2');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0F0F0F;
      --charcoal: #1A1A1A;
      --orange: #C05200;
      --orange-glow: rgba(229, 98, 11, 0.15);
      --light: #FAFAF7;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--light);
      background: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 30%, rgba(229, 98, 11, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(229, 98, 11, 0.07) 0%, transparent 50%),
        linear-gradient(135deg, #0F0F0F 0%, #1A1A1A 100%);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .card {
      max-width: 600px;
      width: 100%;
    }

    .error-code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 800;
      line-height: 1;
      color: var(--orange);
      letter-spacing: -0.04em;
      margin-bottom: 0.25rem;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--light);
    }

    p {
      font-size: 1.0625rem;
      color: rgba(250, 250, 247, 0.65);
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: 4px;
      text-decoration: none;
      transition: background 200ms ease, color 200ms ease, border-color 200ms ease;
    }

    .btn-primary {
      background: var(--orange);
      color: #fff;
      border: 2px solid var(--orange);
    }

    .btn-primary:hover {
      background: #A34500;
      border-color: #A34500;
    }

    .btn-outline {
      background: transparent;
      color: var(--light);
      border: 2px solid rgba(250, 250, 247, 0.35);
    }

    .btn-outline:hover {
      border-color: var(--light);
    }

    .divider {
      width: 48px;
      height: 3px;
      background: var(--orange);
      margin: 1.5rem auto 2rem;
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: rgba(250, 250, 247, 0.35);
    }

    footer a {
      color: rgba(250, 250, 247, 0.5);
      text-decoration: none;
    }

    footer a:hover { color: var(--orange); }

    :focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 3px;
    }
  </style>
</head>
<body>

  <main>
    <div class="card">
      <p class="error-code">404</p>
      <div class="divider"></div>
      <h1>Page introuvable</h1>
      <p>
        La page que vous cherchez n'existe pas ou a été déplacée.<br>
        Retournez à l'accueil ou contactez-nous directement.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Retour à l'accueil</a>
        <a href="/preprod/contact.html" class="btn btn-outline">Nous contacter</a>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 STV 83 — Sablage Thermolaquage Varois &middot; La Seyne-sur-Mer (83) &middot;
    <a href="tel:0760249313">07 60 24 93 13</a>
  </footer>

</body>
</html>
