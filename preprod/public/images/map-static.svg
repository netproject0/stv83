<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Localisation STV 83 — 177 Montée batterie de la Montagne, La Seyne-sur-Mer">
  <defs>
    <pattern id="grid-sm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D8D8CE" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-lg" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-sm)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#C8C8C0" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Map background -->
  <rect width="600" height="400" fill="#EEE8D8"/>
  <rect width="600" height="400" fill="url(#grid-lg)"/>

  <!-- Simulated road network — horizontal -->
  <line x1="0" y1="200" x2="600" y2="200" stroke="#FFF" stroke-width="10" stroke-linecap="round"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="#E8D8A0" stroke-width="7"/>

  <line x1="0" y1="130" x2="600" y2="145" stroke="#FFF" stroke-width="8"/>
  <line x1="0" y1="130" x2="600" y2="145" stroke="#F0E4B0" stroke-width="5"/>

  <line x1="0" y1="300" x2="600" y2="285" stroke="#FFF" stroke-width="6"/>
  <line x1="0" y1="300" x2="600" y2="285" stroke="#F0E4B0" stroke-width="4"/>

  <!-- Vertical roads -->
  <line x1="180" y1="0" x2="190" y2="400" stroke="#FFF" stroke-width="7"/>
  <line x1="180" y1="0" x2="190" y2="400" stroke="#E8D8A0" stroke-width="5"/>

  <line x1="380" y1="0" x2="370" y2="400" stroke="#FFF" stroke-width="9"/>
  <line x1="380" y1="0" x2="370" y2="400" stroke="#F0E4B0" stroke-width="6"/>

  <line x1="490" y1="0" x2="480" y2="400" stroke="#FFF" stroke-width="6"/>
  <line x1="490" y1="0" x2="480" y2="400" stroke="#F0E4B0" stroke-width="4"/>

  <!-- Diagonal road (Montée batterie) -->
  <line x1="80" y1="400" x2="320" y2="150" stroke="#FFF" stroke-width="8"/>
  <line x1="80" y1="400" x2="320" y2="150" stroke="#F0D898" stroke-width="5"/>

  <!-- Green area (vegetation) -->
  <ellipse cx="480" cy="80" rx="90" ry="55" fill="#C8DDB0" opacity="0.7"/>
  <ellipse cx="80" cy="340" rx="65" ry="40" fill="#C8DDB0" opacity="0.7"/>

  <!-- Block buildings (simplified) -->
  <rect x="60" y="100" width="55" height="40" fill="#D8CFBC" rx="2"/>
  <rect x="220" y="55" width="80" height="50" fill="#D8CFBC" rx="2"/>
  <rect x="410" y="220" width="60" height="55" fill="#D8CFBC" rx="2"/>
  <rect x="230" y="260" width="70" height="40" fill="#D8CFBC" rx="2"/>
  <rect x="100" y="220" width="55" height="45" fill="#D8CFBC" rx="2"/>
  <rect x="500" y="160" width="65" height="50" fill="#D8CFBC" rx="2"/>

  <!-- Road labels -->
  <text x="60" y="193" font-family="Arial, sans-serif" font-size="10" fill="#888" font-weight="600" transform="rotate(-1, 60, 193)">Chemin de la Montagne</text>
  <text x="200" y="125" font-family="Arial, sans-serif" font-size="9" fill="#999">Route nationale</text>

  <!-- Map border -->
  <rect width="600" height="400" fill="none" stroke="#B8B0A0" stroke-width="2"/>

  <!-- Marker pin for STV 83 -->
  <g transform="translate(290, 175)" filter="url(#shadow)">
    <!-- Pin body -->
    <path d="M0,-32 C-14,-32 -22,-20 -22,-10 C-22,6 0,28 0,28 C0,28 22,6 22,-10 C22,-20 14,-32 0,-32 Z" fill="#C05200"/>
    <!-- Pin inner circle -->
    <circle cx="0" cy="-10" r="9" fill="#FFF" opacity="0.9"/>
    <!-- Pin dot -->
    <circle cx="0" cy="-10" r="5" fill="#C05200"/>
  </g>

  <!-- Label callout -->
  <g transform="translate(305, 135)">
    <rect x="-5" y="-38" width="190" height="52" rx="6" fill="#FFF" stroke="#D0C8B8" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Triangle pointer -->
    <polygon points="-5,14 5,14 0,22" fill="#FFF" stroke="#D0C8B8" stroke-width="1"/>
    <polygon points="-3,14 3,14 0,20" fill="#FFF"/>
    <text x="5" y="-20" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222">STV 83</text>
    <text x="5" y="-6" font-family="Arial, sans-serif" font-size="9.5" fill="#555">177 Montée batterie de la Montagne</text>
    <text x="5" y="7" font-family="Arial, sans-serif" font-size="9.5" fill="#555">83500 La Seyne-sur-Mer</text>
  </g>

  <!-- Compass rose (small) -->
  <g transform="translate(555, 355)">
    <circle cx="0" cy="0" r="18" fill="rgba(255,255,255,0.85)" stroke="#C8C0B0" stroke-width="1"/>
    <text x="0" y="-6" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#C05200" text-anchor="middle">N</text>
    <line x1="0" y1="-2" x2="0" y2="8" stroke="#888" stroke-width="1.5"/>
  </g>

  <!-- Attribution -->
  <text x="4" y="396" font-family="Arial, sans-serif" font-size="9" fill="#888">© OpenStreetMap contributors — 43.118065, 5.873483</text>
</svg>
